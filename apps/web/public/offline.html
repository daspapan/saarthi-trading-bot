<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saarthi: offline</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; background: #f4f6f9; color: #0f172a; margin: 0; padding: 2rem; }
  .card { max-width: 30rem; margin: 10vh auto; background: #fff; border: 1px solid #d5dce5; border-radius: 1rem; padding: 1.5rem; }
  h1 { margin: 0 0 .5rem; font-size: 1.6rem; } code { font: 15px ui-monospace, Menlo, monospace; background: #eef2f7; padding: .1rem .3rem; border-radius: .3rem; }
  .note { color: #be123c; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach Saarthi</h1>
    <p>This phone can't reach the computer Saarthi runs on. Check that both are on the same Wi-Fi and that <code>npm run dev</code> is running.</p>
    <p class="note">Your open positions still have their stops on the exchange. To stop everything from the computer itself: <code>npm run kill -- &lt;PIN&gt;</code></p>
  </div>
</body>
